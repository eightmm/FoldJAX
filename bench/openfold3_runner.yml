# Runner for the bench's upstream OpenFold3 column.
#
# The released prediction defaults already match the bench schedule for steps
# and samples (`no_full_rollout_steps: 200`, `no_full_rollout_samples: 5`,
# model_config.py:184-185); the two things the defaults do not carry are the
# bench's 10 recycles (upstream default 3) and its fixed seed.
model_update:
  presets:
    - predict
  custom:
    architecture:
      shared:
        num_recycles: 10
    settings:
      memory:
        eval:
          # The v0.5 predict preset dynamically tunes chunks up to 1,024 and
          # offloads confidence heads above 2,800 tokens. This benchmark host
          # has enough HBM to keep those heads on device, so only that offload
          # is disabled; the released chunk tuner and Triton defaults remain.
          offload_inference:
            confidence_heads: false
experiment_settings:
  seeds:
    - 101
