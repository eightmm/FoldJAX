name: Finalize Fold-CP implementation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.3"
          enable-cache: true

      - name: Apply final implementation fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new, 1))

          cp_atom = "src/foldjax/models/_cp_atom.py"
          replace_once(
              cp_atom,
              '''    if mesh is None:

                  def one(indices_b, valid_b, values_b):
                      values_b = values_b * valid_b[:, None].astype(values_b.dtype)
                      sums = jnp.zeros((num_tokens, values_b.shape[-1]), dtype=values_b.dtype)
                      counts = jnp.zeros((num_tokens,), dtype=values_b.dtype)
                      sums = sums.at[indices_b].add(values_b)
                      counts = counts.at[indices_b].add(valid_b.astype(values_b.dtype))
                      return sums / (counts[:, None] + eps)

                  return jax.vmap(one)(token_indices, valid, atom_values)
          ''',
              '''    if mesh is None:
                  output_dtype = atom_values.dtype

                  def one(indices_b, valid_b, values_b):
                      values_f = values_b.astype(jnp.float32)
                      values_f = values_f * valid_b[:, None].astype(jnp.float32)
                      sums = jnp.zeros((num_tokens, values_b.shape[-1]), dtype=jnp.float32)
                      counts = jnp.zeros((num_tokens,), dtype=jnp.float32)
                      sums = sums.at[indices_b].add(values_f)
                      counts = counts.at[indices_b].add(valid_b.astype(jnp.float32))
                      return (sums / (counts[:, None] + eps)).astype(output_dtype)

                  return jax.vmap(one)(token_indices, valid, atom_values)
          ''',
          )
          replace_once(
              cp_atom,
              '''    def local(values_local, indices_local, valid_local):
                  def one(indices_b, valid_b, values_b):
                      values_b = values_b * valid_b[:, None].astype(values_b.dtype)
                      sums = jnp.zeros((num_tokens, values_b.shape[-1]), dtype=values_b.dtype)
                      counts = jnp.zeros((num_tokens,), dtype=values_b.dtype)
                      sums = sums.at[indices_b].add(values_b)
                      counts = counts.at[indices_b].add(valid_b.astype(values_b.dtype))
                      return sums, counts
          ''',
              '''    def local(values_local, indices_local, valid_local):
                  output_dtype = values_local.dtype

                  def one(indices_b, valid_b, values_b):
                      values_f = values_b.astype(jnp.float32)
                      values_f = values_f * valid_b[:, None].astype(jnp.float32)
                      sums = jnp.zeros((num_tokens, values_b.shape[-1]), dtype=jnp.float32)
                      counts = jnp.zeros((num_tokens,), dtype=jnp.float32)
                      sums = sums.at[indices_b].add(values_f)
                      counts = counts.at[indices_b].add(valid_b.astype(jnp.float32))
                      return sums, counts
          ''',
          )
          replace_once(
              cp_atom,
              '''        return sums / (counts[..., None] + eps)
          ''',
              '''        return (sums / (counts[..., None] + eps)).astype(output_dtype)
          ''',
          )
          replace_once(
              cp_atom,
              '''        logits = (
                      logits + (1.0 - mask_local[:, None, None, :].astype(jnp.float32)) * -inf
                  )
          ''',
              '''        # A true -inf mask preserves the empty-row contract. A finite
                  # surrogate would turn an all-masked row into a uniform distribution.
                  key_valid = mask_local[:, None, None, :].astype(bool)
                  logits = jnp.where(key_valid, logits, -jnp.inf)
          ''',
          )

          context_test = "tests/models/boltz2/test_context_parallel.py"
          replace_once(
              context_test,
              '''    def norm(c):
                  return {"scale": arr(c) * 0.1 + 1.0, "bias": arr(c) * 0.1}

              def tri_mult():
          ''',
              '''    def norm(c):
                  return {"scale": arr(c) * 0.1 + 1.0, "bias": arr(c) * 0.1}

              def weight(fan_in, fan_out, gain=1.0):
                  # Match ordinary fan-in scaling. The former fixed sigma=0.5 made
                  # widened synthetic transitions an artificial error amplifier.
                  return arr(fan_in, fan_out) * (gain / (0.5 * np.sqrt(fan_in)))

              def tri_mult():
          ''',
          )
          replacements = {
              '"g_in": {"kernel": arr(C, 2 * C)}': '"g_in": {"kernel": weight(C, 2 * C)}',
              '"p_in": {"kernel": arr(C, 2 * C)}': '"p_in": {"kernel": weight(C, 2 * C)}',
              '"p_out": {"kernel": arr(C, C)}': '"p_out": {"kernel": weight(C, C)}',
              '"g_out": {"kernel": arr(C, C)}': '"g_out": {"kernel": weight(C, C)}',
              '"linear": {"kernel": arr(C, HEADS)}': '"linear": {"kernel": weight(C, HEADS)}',
              '"linear_q": {"kernel": arr(C, C)}': '"linear_q": {"kernel": weight(C, C)}',
              '"linear_k": {"kernel": arr(C, C)}': '"linear_k": {"kernel": weight(C, C)}',
              '"linear_v": {"kernel": arr(C, C)}': '"linear_v": {"kernel": weight(C, C)}',
              '"linear_g": {"kernel": arr(C, C)}': '"linear_g": {"kernel": weight(C, C)}',
              '"linear_o": {"kernel": arr(C, C)}': '"linear_o": {"kernel": weight(C, C)}',
              '"fc1": {"kernel": arr(C, 4 * C)}': '"fc1": {"kernel": weight(C, 4 * C)}',
              '"fc2": {"kernel": arr(C, 4 * C)}': '"fc2": {"kernel": weight(C, 4 * C)}',
              '"fc3": {"kernel": arr(4 * C, C)}': '"fc3": {"kernel": weight(4 * C, C)}',
          }
          text = Path(context_test).read_text()
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{context_test}: {old!r} count={count}")
              text = text.replace(old, new, 1)
          Path(context_test).write_text(text)
          PY

          cat > tests/models/boltz2/test_atom_cp_numerics.py <<'PYTEST'
          """Numerical contracts for Fold-CP atom reductions and masked attention."""

          from __future__ import annotations

          import subprocess
          import sys
          import textwrap


          _PROBE = textwrap.dedent(
              r"""
              import jax
              import jax.numpy as jnp
              import numpy as np

              from foldjax.models._cp import context_parallel
              from foldjax.models._cp_atom import (
                  pair_bias_attention_2d,
                  scatter_atoms_to_tokens_mean_cp,
              )

              assert jax.device_count() == 4
              rng = np.random.default_rng(20260820)

              indices = jnp.asarray([np.arange(32) % 8], dtype=jnp.int32)
              valid = jnp.ones((1, 32), dtype=bool)
              values = jnp.asarray(rng.normal(size=(1, 32, 4)), dtype=jnp.bfloat16)
              reference = scatter_atoms_to_tokens_mean_cp(
                  values, indices, valid, num_tokens=8
              )
              with context_parallel(4, layout="2d"):
                  distributed = jax.jit(
                      lambda x: scatter_atoms_to_tokens_mean_cp(
                          x, indices, valid, num_tokens=8
                      )
                  )(values)
              np.testing.assert_array_equal(
                  jax.device_get(reference), jax.device_get(distributed)
              )
              assert distributed.dtype == jnp.bfloat16

              q = jnp.asarray(rng.normal(size=(1, 8, 2, 3)), dtype=jnp.float32)
              k = jnp.asarray(rng.normal(size=(1, 8, 2, 3)), dtype=jnp.float32)
              v = jnp.asarray(rng.normal(size=(1, 8, 2, 3)), dtype=jnp.float32)
              bias = jnp.asarray(rng.normal(size=(1, 2, 8, 8)), dtype=jnp.float32)
              empty_mask = jnp.zeros((1, 8), dtype=jnp.float32)
              with context_parallel(4, layout="2d"):
                  empty = jax.jit(
                      lambda qv, kv, vv, bv, mv: pair_bias_attention_2d(
                          qv, kv, vv, bv, mv, scale=3 ** -0.5
                      )
                  )(q, k, v, bias, empty_mask)
              got = jax.device_get(empty)
              np.testing.assert_array_equal(got, np.zeros_like(got))
              assert np.isfinite(got).all()
              print("ATOM_NUMERICS_OK")
              """
          )


          def test_atom_cp_reductions_and_empty_attention_are_stable() -> None:
              completed = subprocess.run(
                  [sys.executable, "-c", _PROBE],
                  capture_output=True,
                  text=True,
                  env={
                      "JAX_PLATFORMS": "cpu",
                      "XLA_FLAGS": "--xla_force_host_platform_device_count=4",
                      "PATH": "/usr/bin",
                  },
                  timeout=240,
              )
              assert completed.returncode == 0, completed.stdout + completed.stderr
              assert "ATOM_NUMERICS_OK" in completed.stdout
          PYTEST

      - name: Install validation environment
        run: uv sync --group dev --frozen

      - name: Format and lint
        run: |
          uv run --no-sync ruff format \
            src/foldjax/models/_cp_atom.py \
            tests/models/boltz2/test_context_parallel.py \
            tests/models/boltz2/test_atom_cp_numerics.py
          uv run --no-sync ruff check \
            src/foldjax/models/_cp_atom.py \
            tests/models/boltz2/test_context_parallel.py \
            tests/models/boltz2/test_atom_cp_numerics.py

      - name: Focused Fold-CP proof gate
        run: |
          uv run --no-sync pytest -q \
            tests/models/boltz2/test_context_parallel.py \
            tests/models/boltz2/test_atom_context_parallel.py \
            tests/models/boltz2/test_atom_cp_numerics.py \
            tests/models/test_cp_masked_ring.py \
            tests/models/test_cp_runtime.py
          uv run --no-sync python -m compileall -q \
            src/foldjax/models/_cp_atom.py \
            tests/models/boltz2/test_context_parallel.py \
            tests/models/boltz2/test_atom_cp_numerics.py
          git diff --check

      - name: Commit finalized implementation
        shell: bash
        run: |
          rm .github/workflows/materialize-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden Fold-CP atom numerics and parity gates'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
