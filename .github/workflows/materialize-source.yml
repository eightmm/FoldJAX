name: Finalize Fold-CP implementation

on:
  push:
    branches:
      - agent/fold-cp-jax-complete

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.3"
          enable-cache: true
      - name: Apply final implementation fixes
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          payload = "\,"
          Path("/tmp/foldcp-final.patch").write_bytes(base64.b64decode(payload))
          PY
          git apply --check /tmp/foldcp-final.patch
          git apply /tmp/foldcp-final.patch
      - name: Install validation environment
        run: uv sync --group dev --frozen
      - name: Format and lint
        run: |
          uv run --no-sync ruff format \
            src/foldjax/models/_cp_atom.py \
            tests/models/boltz2/test_context_parallel.py \
            tests/models/boltz2/test_atom_context_parallel.py
          uv run --no-sync ruff check \
            src/foldjax/models/_cp_atom.py \
            tests/models/boltz2/test_context_parallel.py \
            tests/models/boltz2/test_atom_context_parallel.py
      - name: Focused Fold-CP proof gate
        run: |
          uv run --no-sync pytest -q \
            tests/models/boltz2/test_context_parallel.py \
            tests/models/boltz2/test_atom_context_parallel.py \
            tests/models/test_cp_masked_ring.py \
            tests/models/test_cp_runtime.py
          uv run --no-sync python -m compileall -q \
            src/foldjax/models/_cp_atom.py \
            tests/models/boltz2/test_context_parallel.py \
            tests/models/boltz2/test_atom_context_parallel.py
          git diff --check
      - name: Commit finalized implementation
        shell: bash
        run: |
          rm .github/workflows/materialize-source.yml
          printf '%s\n' 'Fold-CP finalizer completed; remove this marker to trigger the canonical PR CI.' > .foldcp-finalized
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden Fold-CP atom numerics and parity gates'
          git push origin HEAD:agent/fold-cp-jax-complete
