name: Finalize Fold-CP JAX

on:
  push:
    branches: [agent/fold-cp-jax-complete]
    paths:
      - .github/workflows/finalize-fold-cp.yml
      - tools/finalize_fold_cp.py
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: finalize-fold-cp-jax
  cancel-in-progress: false
env:
  JAX_PLATFORMS: cpu

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fold-cp-jax-complete
          fetch-depth: 0

      - name: Apply final implementation
        run: python tools/finalize_fold_cp.py

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.3"
          enable-cache: true

      - name: Install test environment
        run: uv sync --group dev --frozen

      - name: Format and lint changed code
        run: |
          uv run --no-sync ruff format \
            src/foldjax/models/_cp.py \
            src/foldjax/models/_cp_attention.py \
            src/foldjax/models/boltz2/models/triangle/triangle_attention.py \
            src/foldjax/models/protenix/models/triangle/triangle.py \
            src/foldjax/models/openfold3/models/triangle_attention.py \
            tests/models/test_cp_runtime.py \
            tests/models/test_cp_masked_ring.py \
            tests/models/protenix/test_context_parallel.py
          uv run --no-sync ruff check --fix \
            src/foldjax/models/_cp.py \
            src/foldjax/models/_cp_attention.py \
            src/foldjax/models/boltz2/models/triangle/triangle_attention.py \
            src/foldjax/models/protenix/models/triangle/triangle.py \
            src/foldjax/models/openfold3/models/triangle_attention.py \
            tests/models/test_cp_runtime.py \
            tests/models/test_cp_masked_ring.py \
            tests/models/protenix/test_context_parallel.py
          git diff --check

      - name: Run Fold-CP proof gates
        # Tolerances remain fixed: numerical drift must be corrected in the
        # distributed implementation rather than hidden by weakening a gate.
        run: |
          uv run --no-sync pytest -q \
            tests/models/test_cp_runtime.py \
            tests/models/test_cp_ring_attention.py \
            tests/models/test_cp_masked_ring.py \
            tests/models/boltz2/test_context_parallel.py \
            tests/models/protenix/test_context_parallel.py \
            tests/models/opendde/test_context_parallel.py \
            tests/models/openfold3/test_context_parallel.py \
            tests/models/esmfold2/test_context_parallel.py

      - name: Commit validated implementation
        run: |
          rm -f tools/finalize_fold_cp.py
          rm -f .github/workflows/finalize-fold-cp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete gather-free Fold-CP pair runtime"
          git push origin HEAD:agent/fold-cp-jax-complete
