name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAX_PLATFORMS: cpu
  UV_PYTHON: "3.13"

# Runners are pinned (`ubuntu-24.04`, not `ubuntu-latest`): the label moves to a
# new release on its own schedule, and a toolchain change underneath the
# AlphaFold 3 extension build should arrive as a reviewed edit, not a red run.
jobs:
  lint:
    name: lint + lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.10.3"
          enable-cache: true
          python-version: "3.13"

      - name: Install
        run: uv sync --no-default-groups --group dev --frozen

      - name: Lockfile is current
        run: uv lock --check

      - name: Lint
        run: uv run --no-sync ruff check .

  # Everything except `slow` (end-to-end and heavy-compile tests) and `network`;
  # those run in `nightly.yml`. The 80% coverage gate is enforced over the
  # combined shards.
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      markers: not network and not slow
      coverage: true


  imports:
    name: every backend registers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.10.3"
          enable-cache: true
          python-version: "3.13"

      # Without `--no-default-groups` this installs the default `gpu` group's
      # CUDA wheels on a CPU runner.
      - name: Install without dev dependencies
        run: uv sync --frozen --no-default-groups

      # `uv sync` exercises an editable checkout. Build and install the actual
      # artifact as well, in a second environment whose working directory is
      # outside the repository, so package-data or console-script mistakes
      # cannot be hidden by the source tree. Populate that environment from the
      # frozen lock without installing the checkout, then install the wheel
      # itself without dependencies. The sync above has already filled uv's
      # cache, so this is normally a set of local links rather than downloads.
      - name: Fresh wheel install and CLI smoke
        run: |
          WHEEL_DIR="$RUNNER_TEMP/foldjax-wheel"
          SMOKE_ENV="$RUNNER_TEMP/foldjax-wheel-smoke"
          uv build --wheel --out-dir "$WHEEL_DIR"
          uv venv --python 3.13 "$SMOKE_ENV"
          UV_PROJECT_ENVIRONMENT="$SMOKE_ENV" \
            uv sync --frozen --no-default-groups --no-install-project
          uv pip install --no-deps --python "$SMOKE_ENV/bin/python" \
            "$WHEEL_DIR"/foldjax-*.whl
          cd "$RUNNER_TEMP"
          "$SMOKE_ENV/bin/foldjax" --help
          "$SMOKE_ENV/bin/foldjax" models --json

      # Importing the package is not the same as reaching each adapter: a
      # backend is resolved lazily, so a broken import in one of them stays
      # invisible until someone selects that model.
      - name: Resolve each backend
        run: |
          uv run --no-sync python - <<'PY'
          from foldjax import available_models, capabilities
          for model in available_models():
              caps = capabilities(model)
              print(f"{model}: {sorted(caps.sampling)}")
          PY
