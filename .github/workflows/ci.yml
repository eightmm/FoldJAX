name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # These graphs take minutes to compile and the runner has no GPU, so nothing
  # here should try. Keeping it explicit also stops a stray CUDA plugin from
  # changing what the suite exercises.
  JAX_PLATFORMS: cpu

jobs:
  check:
    name: lint + tests (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.3"
          enable-cache: true

      # A clean runner has no sibling checkouts, which is the whole point: an
      # `openfold3` extra once resolved to `../openfold3_jax` and made this
      # command fail for everyone but the machine it was written on. That port
      # is vendored now, along with the shared MSA search and the real-target
      # loader, so nothing outside this repository is named here. AlphaFold 3
      # is the one thing that still cannot be -- it is not redistributable and
      # pins an incompatible CUDA generation. This job is the regression test
      # for all of it: uv resolves every extra to build the lockfile, so a path
      # dependency that exists on one machine breaks `uv sync` on every other.
      - name: Install
        run: uv sync --group dev --frozen

      - name: Lockfile is current
        run: uv lock --check

      - name: Lint
        run: uv run --no-sync ruff check .

      # No CUDA extra: the CPU wheel is what a GPU-less runner can install, and
      # it still collects every test that does not need a device. The GPU
      # suites and the torch-parity gates skip themselves.
      #
      # The coverage gate lives here rather than in addopts: it only means
      # anything on a full run, and in addopts it made every focused local
      # invocation exit 1. It covers the orchestration layer only — the
      # vendored ports were built against upstream torch parity rather than
      # line coverage, so holding them to a line number would measure the
      # wrong thing.
      - name: Tests
        run: >
          uv run --no-sync pytest -q
          --cov=foldjax --cov-report=term-missing --cov-fail-under=80

  imports:
    name: every backend registers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.3"
          enable-cache: true

      - name: Install without dev dependencies
        run: uv sync --frozen

      # Importing the package is not the same as reaching each adapter: a
      # backend is resolved lazily, so a broken import in one of them stays
      # invisible until someone selects that model.
      - name: Resolve each backend
        run: |
          uv run --no-sync python - <<'PY'
          from foldjax import available_models, capabilities
          for model in available_models():
              caps = capabilities(model)
              print(f"{model}: {sorted(caps.sampling)}")
          PY
