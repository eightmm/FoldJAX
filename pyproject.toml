[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foldjax"
version = "0.3.0"
description = "Six biomolecular structure-prediction models behind one JAX interface"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
keywords = [
    "biomolecular-structure-prediction",
    "alphafold3",
    "boltz-2",
    "esmfold2",
    "jax",
    "opendde",
    "openfold3",
    "protein-structure",
    "protenix",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Union of the six carried models' runtime requirements. FoldJAX itself adds
# no third-party dependency beyond what the vendored models already need.
# OpenFold3 added none: its inference path needs only jax, numpy, safetensors
# and gemmi, all of which were already here. Retired model-specific archive
# dependencies are intentionally absent from the standalone runtime.
dependencies = [
    # shared JAX runtime
    "jax==0.11.1",
    "numpy>=2.1",
    "cuequivariance==0.11.1",
    "cuequivariance-jax==0.11.1",
    # Qwix (via Tokamax) imports Flax NNX. Flax 0.12.7 resolves against JAX
    # 0.11.1 but still calls the removed MutableHiType API; 0.12.9 contains
    # the matching HiType compatibility update.
    "flax==0.12.9",
    "qwix==0.1.8",
    "tokamax==0.0.13",
    # boltz2
    "chex>=0.1.86",
    "einops>=0.8.0",
    "jaxtyping>=0.2.34",
    "pyyaml>=6.0.2",
    "safetensors>=0.8.0",
    "tqdm>=4.66.0",
    # Boltz-2 writes mmCIF through modelcif. The validated six-model runtime is
    # currently held to the Gemmi 0.7 ABI until a separate compatibility sweep.
    "gemmi>=0.7.5,<0.8",
    "modelcif>=1.0",
    # protenix/opendde preprocessing. AlphaFold 3 pins rdkit==2025.9.4
    # exactly, so the floor stays at that release for the optional af3 extra.
    "rdkit>=2025.9.4,<2026",
    # opendde
    "scipy>=1.15",
    # Boltz-2 preprocessing. These are ordinary scientific libraries, none of
    # which pulls torch; only the featurizer's *array* layer used to need it,
    # and that now runs on NumPy. Keeping them in the base set is what lets the
    # boltz2 backend predict from a torch-free environment.
    "biopython>=1.83",
    "chembl_structure_pipeline>=1.2",
    "hydra-core==1.3.2",
    "ihm>=1.0",
    "mashumaro==3.14",
    "numba>=0.61",
    "pandas>=2.0",
    "requests>=2.31",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# The CUDA-12 twin of `cuda13`, for clusters whose driver generation differs
# per node: one checkout, one lockfile, one environment per node type
# (`UV_PROJECT_ENVIRONMENT=.venv-cu12 uv sync --extra cuda12 ...`). The two
# extras conflict by construction -- see [tool.uv] -- and everything else
# (vendored sources, the CPU-only AlphaFold 3 pybind module, the weight store,
# compile caches) is CUDA-generation-agnostic and shared.
cuda12 = [
    "cuequivariance-ops-jax-cu12==0.11.1",
    "jax[cuda12]==0.11.1",
    "triton==3.7.1",
]
cuda13 = [
    "cuequivariance-ops-jax-cu13==0.11.1",
    "jax[cuda13]==0.11.1",
    # cuequivariance-jax's GPU layer-norm/triangle kernels import triton but do
    # not declare it. It used to arrive via torch; now that prediction is
    # torch-free it has to be asked for directly.
    "triton==3.7.1",
]
# OpenFold3 featurization. Feature-archive prediction needs none of this; raw
# JSON prediction uses these chemistry/data packages through FoldJAX's local
# NumPy/JAX featurizer.  Training-framework dependencies intentionally do not
# appear here: every advertised combination of extras remains Torch-free.
#
# Upstream's data pipeline is *vendored* at
# `models/openfold3/_upstream/`, so no checkout is needed any more -- but the
# selected sample-processing routines remain close to upstream, while tensor
# construction and one-query orchestration are FoldJAX-owned. `numpy`,
# `pandas`, `scipy`, `requests`, `tqdm`, `pyyaml`, `gemmi`, `rdkit` and
# `biopython` are already in the base set.
#
# `deepspeed` is deliberately absent: upstream guards it with `find_spec` and
# only uses it to disable a Triton autotune, so its absence is a supported
# configuration.
openfold3-preprocess = [
    "absl-py>=2.3.1",
    "awscrt",
    "biotite",
    "boto3",
    "click",
    "func-timeout",
    "ijson",
    "kalign-python",
    "lmdb",
    "memory-profiler",
    "ml-collections>=0.1.1",
    "networkx",
    "pdbeccdutils",
    "pydantic",
]
# Publisher parity environments are deliberately external to FoldJAX's package
# metadata. They remain useful for development evidence, but installing any
# FoldJAX extra must not install a second tensor runtime.
# The vendored AlphaFold 3's runtime, beyond what the base set carries: its
# source lives at `foldjax.models.alphafold3._upstream` and imports resolve
# against this environment, so upstream's `jax[cuda12]` pin never applies.
# jax, numpy, rdkit and tokamax are already here at compatible versions.
alphafold3 = [
    "absl-py>=2.3.1",
    "dm-haiku==0.0.17",
    "etils[epath]",
    "tqdm",
    "zstandard",
]
# No backend needs a package from outside this file. AlphaFold 3's source is
# vendored at `foldjax.models.alphafold3._upstream` (its compiled half is built
# in the writable FoldJAX runtime store on first use). Public parameters are downloaded with
# `foldjax weights fetch`; AlphaFold 3 and gated OpenFold3 parameters are placed
# in the managed store manually under their publishers' terms.

[tool.uv]
conflicts = [[{ extra = "cuda12" }, { extra = "cuda13" }]]

[project.urls]
Homepage = "https://github.com/eightmm/foldjax"
Issues = "https://github.com/eightmm/foldjax/issues"

[project.scripts]
foldjax = "foldjax.cli:entrypoint"
# Native per-model entry points, preserved from the vendored ports so their own
# docs and error messages stay accurate.
boltz-jax-export-weights = "foldjax.models.boltz2.bridge.export_weights:main"
boltz-jax-inspect-checkpoint = "foldjax.models.boltz2.bridge.checkpoint:main"
opendde-jax-export-weights = "foldjax.models.opendde.bridge.export_weights:main"
opendde-jax-predict = "foldjax.models.opendde.cli.predict:main"
opendde-jax-verify-inputs = "foldjax.models.opendde.cli.verify_inputs:main"
openfold3-jax-featurize = "foldjax.models.openfold3.cli.featurize:entrypoint"
openfold3-jax-inspect-checkpoint = "foldjax.models.openfold3.cli.inspect_checkpoint:entrypoint"
openfold3-jax-predict = "foldjax.models.openfold3.cli.predict:entrypoint"
openfold3-jax-verify-checkpoint = "foldjax.models.openfold3.cli.verify_checkpoint:entrypoint"
protenix-jax-export-weights = "foldjax.models.protenix.bridge.export_weights:main"
protenix-jax-featurize-json = "foldjax.models.protenix.data.featurize_json:main"
protenix-jax-predict = "foldjax.models.protenix.cli.predict:main"
protenix-jax-static-infer = "foldjax.models.protenix.cli.static_infer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The public surface is fully annotated. Without this marker a downstream
# mypy/pyright sees `Any` for every FoldJAX symbol, which is worse than no
# annotations at all: it silently disables checking at the boundary.
"foldjax" = ["py.typed"]
# Every vendored port ships its upstream's licence and attribution with it.
"foldjax.models.opendde" = ["data/*.npz", "LICENSE", "NOTICE"]
"foldjax.models.protenix" = ["data/*.npz", "LICENSE", "NOTICE"]
"foldjax.models.boltz2" = ["LICENSE", "NOTICE"]
"foldjax.models.esmfold2" = ["LICENSE", "NOTICE"]
"foldjax.models.openfold3" = ["LICENSE", "NOTICE"]
# AlphaFold 3 builds its ABI-specific ``cpp`` extension on first use. The
# builder stages upstream's own project from this package, so a source install
# needs the build metadata, licence/terms, and every C++ source/header/stub --
# Python modules alone make an install that imports successfully and then fails
# when prediction tries to compile the extension.
"foldjax.models.alphafold3._upstream" = [
    "CMakeLists.txt",
    "pyproject.toml",
    "LICENSE",
    "NOTICE",
    "*_TERMS_OF_USE.md",
    "*_POLICY.md",
    "alphafold3/*_TERMS_OF_USE.md",
    "alphafold3/*_POLICY.md",
    "alphafold3/**/*.cc",
    "alphafold3/**/*.h",
    "alphafold3/**/*.pyi",
]
# The vendored upstream data pipeline reads its own reference chemistry from
# disk: per-residue SDF conformers, the canonical protein/RNA tables, and the
# model-setting presets. Without these the wheel imports and then fails at the
# first featurization, which is the worst place to find out.
"foldjax.models.openfold3._upstream.openfold3.core.data.resources" = [
    "canonical_protein_data/*.json",
    "canonical_protein_data/reference_mols/*.sdf",
    "canonical_RNA_data/*.json",
]
"foldjax.models.openfold3._upstream.openfold3.projects.of3_all_atom.config" = ["*.yml"]
# AlphaFold 3 is driven, not ported, but the program that drives it lives at
# upstream's repository root and so is missing from an installed `alphafold3`.
# The copy travels with the same licence and attribution as a vendored port.
"foldjax.backends._alphafold3_upstream" = ["LICENSE", "NOTICE"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    # Used to assert the materialized Boltz job really parses as YAML.
    "pyyaml>=6.0.2",
    "ruff>=0.6.0",
    # The vendored Boltz-2 suite compares against an einx reference.
    "einx>=0.4.3",
]

[tool.ruff]
line-length = 88
target-version = "py313"
# Vendored from upstream with narrowly documented runtime patches, so upstream's
# style is kept: broad reformatting would obscure the small reviewable delta.
# Both are Apache-2.0 or MIT and carry their LICENSE/NOTICE.
extend-exclude = [
    "src/foldjax/models/boltz2/data",
    "src/foldjax/models/openfold3/_upstream",
    "src/foldjax/models/alphafold3/_upstream",
    # Byte-identical to upstream's `run_alphafold.py`, which a test asserts.
    "src/foldjax/backends/_alphafold3_upstream/run_alphafold.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is deliberately *not* in addopts. The gate only means anything for a
# full run, so putting it here made every focused invocation fail: `pytest
# tests/test_cache.py` passed its 7 tests and still exited 1 with "Required
# test coverage of 80% not reached", because 7 tests cannot cover the package.
# That turns the ordinary edit-test loop into a permanent red and trains
# everyone to pass --no-cov, which then also disables it when it matters.
#
# CI runs the gate on the whole suite (.github/workflows/ci.yml), which is the
# only place the number is meaningful. To reproduce it locally:
#   pytest --cov=foldjax --cov-report=term-missing --cov-fail-under=80
addopts = ""
markers = [
    "slow: end-to-end / checkpoint-heavy tests",
    "official_parity: requires official model assets or an upstream checkout",
    # The OpenFold3 suite marks every test that compares against upstream's
    # torch modules. Unregistered, it produced a PytestUnknownMarkWarning per
    # test -- 60 of them -- which is how a real warning goes unread.
    "torch_parity: compares against the upstream torch implementation",
    # `tests/_foldbench` fetches depositions from RCSB. Registered for the same
    # reason as the one above: an unknown mark is a warning per test, and a
    # suite that prints warnings by default is a suite whose warnings go unread.
    "network: reaches an external service (RCSB)",
]

[tool.coverage.run]
# The 80% gate is on FoldJAX's own orchestration layer -- the request schema,
# input translation, registry, backends, weight store and CLI. Vendored code is
# excluded because it arrived with its own suite and its own standards, and
# folding it in would make the number say something about the ports rather than
# about the layer the gate exists to protect.
#
# `search/` is vendored on the same terms as `models/`: it was the standalone
# `foldsearch` package and came with `tests/test_search_msa.py`. Without this
# line its 367 statements took the total from 87% to 76.6% and failed CI --
# which would have read as the orchestration layer regressing, when nothing
# there had changed.
# `_alphafold3_upstream/run_alphafold.py` is DeepMind's runner, verbatim -- a
# test asserts byte identity with upstream -- so measuring its lines would put
# 320 vendored statements (16% of the denominator) on the orchestration gate.
omit = [
    "*/foldjax/models/*",
    "*/foldjax/search/*",
    "*/foldjax/backends/_alphafold3_upstream/*",
]
