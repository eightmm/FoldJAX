# Pinning an alignment instead of letting a model search for one.
#
#   foldjax predict --model protenix --input examples/with_alignment.yaml
#
# `unpaired_msa` is a path to an .a3m, relative to this file. Every backend
# translates it into its own dialect: Boltz reads the .a3m directly, and
# AlphaFold 3 and the Protenix-family models get `unpairedMsaPath`. Holding one
# alignment fixed across models is what makes their results comparable.
#
# OpenFold3 reads an alignment's source from its file stem. A database stem it
# knows, such as `uniref90_hits`, is passed through as that source (with that
# source's row cap); any other name is linked in as `colabfold_main`, whose cap
# is the highest (16,384 rows, against 10,000 for `uniref90_hits`).
entities:
  - type: protein
    id: [A]
    sequence: MDTAYPREDTRAPTPSKAGAHTALTLGAPHPPPRDHLIWSVFSTLYLNLCCLGFLALAYSIKARDQKV
    unpaired_msa: uniref90_hits.a3m
